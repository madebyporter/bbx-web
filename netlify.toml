[build]
  command = "npm run build"
  
[build.environment]
  NODE_VERSION = "20.19.0"
  # SEO debug snapshots; omit from secrets scan if re-added accidentally
  SECRETS_SCAN_OMIT_PATHS = "diagnosis-output/**"
  # Public client env vars / site origin are inlined or hardcoded by design (not secrets)
  SECRETS_SCAN_OMIT_KEYS = "NUXT_PUBLIC_POSTHOG_HOST,SITE_URL"

[dev]
  targetPort = 3000
  port = 8888

# Homepage agent discovery (RFC 8288 / RFC 9727) — covers prerendered `/` responses
[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </.well-known/api-catalog>; rel="describedby"; type="application/linkset+json", </openapi/support.json>; rel="service-desc"; type="application/json", </docs/api/support>; rel="service-doc"; type="text/markdown", </openapi/storage.json>; rel="service-desc"; type="application/json", </docs/api/storage>; rel="service-doc"; type="text/markdown", </openapi/resources.json>; rel="service-desc"; type="application/json", </docs/api/resources>; rel="service-doc"; type="text/markdown"'

# Cache audio files from Supabase aggressively
[[headers]]
  for = "https://*.supabase.co/storage/v1/object/public/sounds/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
    
# Cache static assets
[[headers]]
  for = "/img/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ffmpeg/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Note: Content-Type headers removed for dev mode compatibility
# Vite dev server handles MIME types automatically
# These headers would interfere with Vite's module serving in development
# Cache-Control headers are kept for production builds
[[headers]]
  for = "/*.js"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# SPA fallback - redirect only non-file routes to index.html
# Note: In dev mode, Nuxt handles routing, so this mainly applies to production
# TEMPORARILY COMMENTED OUT TO TEST IF IT'S CAUSING MIME TYPE ISSUES IN DEV MODE
# This should come AFTER the /_nuxt/* rule so it doesn't catch Nuxt assets
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
#   force = false
#   # Exclude static assets - they should be served directly
#   # Netlify will serve files before applying redirects, but we set force=false to be safe

# Function configuration for download-sample
[functions."download-sample"]
  timeout = 60  # 60 seconds for audio processing

# Daily at 10:00 UTC — requires env in Netlify UI:
# SUPABASE_SERVICE_KEY, RESEND_API_KEY, CRON_SECRET, RESEND_FROM_EMAIL
# Support feedback notifications (server/api/support.post.ts):
# RESEND_API_KEY, optional SUPPORT_NOTIFY_EMAIL (default: connectbbx@gmail.com)
[functions."send-onboarding-reminders"]
  schedule = "0 10 * * *"

# Daily Resend contact sync for broadcasts — requires env in Netlify UI:
# SUPABASE_SERVICE_KEY, RESEND_API_KEY, CRON_SECRET,
# RESEND_SEGMENT_ID, RESEND_SEGMENT_CREATORS_ID, RESEND_SEGMENT_AUDIO_PROS_ID
[functions."sync-resend-contacts"]
  schedule = "0 11 * * *"